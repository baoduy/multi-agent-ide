# electron-builder configuration
# Docs: https://www.electron.build/configuration.html

appId: com.magenta.ide
productName: Magenta IDE
electronVersion: "41.2.0"

# ── Directories ──────────────────────────────────────────────────────────────
directories:
  buildResources: build
  output: release

# ── Source files to include in the asar archive ──────────────────────────────
# The monorepo layout means we need to explicitly include compiled output
# from every workspace package the app requires at runtime.
files:
  # Main process (Electron entry + preload)
  - packages/main/dist/**/*
  - packages/main/renderer/**/*

  # UI bundle (loaded by renderer/index.html — only the esbuild bundle + CSS needed)
  - packages/ui/dist/bundle.js
  - packages/ui/dist/styles.css

  # Daemon (forked as child process by main — only the esbuild bundle is needed)
  - packages/daemon/dist/daemon-ipc-worker.js

  # Shared types/schemas (imported by main + daemon at runtime)
  - packages/shared/dist/**/*

  # Root package.json is required by Electron to locate the main entry
  - package.json

  # Exclude everything else by default
  - "!**/node_modules/.cache"
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!**/*.map"
  - "!**/src/**"
  - "!**/.git"
  - "!**/docs/**"
  - "!**/specs/**"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/.github/**"
  - "!**/*.d.ts"
  - "!**/*.d.ts.map"
  - "!**/*.js.map"
  - "!**/README*"
  - "!**/CHANGELOG*"

# ── Extra resources (outside the asar, accessible via process.resourcesPath) ─
extraResources:
  # pnpm hoists dependencies into packages/<pkg>/node_modules/ as symlinks,
  # so "from" paths go through the workspace package that owns the dep.

  # node-pty is a native addon required by the daemon (forked with
  # ELECTRON_RUN_AS_NODE=1). Forked processes use plain Node.js require
  # which can't read from asar archives, so the module must live outside
  # the asar entirely. The main process adds this path to NODE_PATH.
  - from: packages/daemon/node_modules/node-pty
    to: node_modules/node-pty
    filter:
      - "**/*"
      - "!src/**"
      - "!*.ts"
      # Exclude prebuilds for other platforms — saves ~65 MB on macOS builds.
      # Each platform build only needs its own prebuilds/<os>-<arch>/ dir.
      - "!prebuilds/win32-*/**"
      - "!prebuilds/linux-*/**"
      - "!prebuilds/darwin-x64/**"
      # Strip build-time artifacts (Makefiles, gyp configs) — not needed at runtime
      - "!build/Makefile"
      - "!build/*.mk"
      - "!build/*.gypi"
      - "!build/gyp-mac-tool"
      - "!build/binding.Makefile"
      # Strip other non-runtime files
      - "!deps/**"
      - "!third_party/**"
      - "!scripts/**"
      - "!typings/**"
      - "!binding.gyp"
      - "!README.md"

  # lmdb is a native addon for the daemon's cache persistence. Same
  # constraint as node-pty: the forked daemon uses plain Node.js require,
  # which can't read native modules from inside the asar archive. lmdb also
  # has hoisted runtime deps (msgpackr, msgpackr-extract, ordered-binary,
  # weak-lru-cache) that each need to live outside the asar.
  - from: packages/daemon/node_modules/lmdb
    to: node_modules/lmdb
    filter:
      - "**/*"
      - "!src/**"
      - "!*.ts"
      - "!prebuilds/win32-*/**"
      - "!prebuilds/linux-*/**"
      - "!prebuilds/darwin-x64/**"
      - "!deps/**"
      - "!scripts/**"
      - "!README.md"
  - from: packages/daemon/node_modules/msgpackr
    to: node_modules/msgpackr
    filter:
      - "**/*"
      - "!*.ts"
      - "!README.md"
  - from: packages/daemon/node_modules/msgpackr-extract
    to: node_modules/msgpackr-extract
    filter:
      - "**/*"
      - "!*.ts"
      - "!prebuilds/win32-*/**"
      - "!prebuilds/linux-*/**"
      - "!prebuilds/darwin-x64/**"
      - "!README.md"
  - from: packages/daemon/node_modules/ordered-binary
    to: node_modules/ordered-binary
    filter:
      - "**/*"
      - "!*.ts"
      - "!README.md"
  - from: packages/daemon/node_modules/weak-lru-cache
    to: node_modules/weak-lru-cache
    filter:
      - "**/*"
      - "!*.ts"
      - "!README.md"

# ── asar ─────────────────────────────────────────────────────────────────────
asar: true
asarUnpack:
  # Native modules and binaries that need to run outside the archive
  - "**/*.node"

# ── Compression ──────────────────────────────────────────────────────────────
compression: maximum

# ── Publishing ───────────────────────────────────────────────────────────────
# Publishing is handled by softprops/action-gh-release in the GitHub Actions
# workflow (not by electron-builder). Set to "never" to prevent electron-builder
# from attempting to publish on its own.
publish: null

# ── macOS ────────────────────────────────────────────────────────────────────
mac:
  icon: build/icons/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  # Hardened runtime enables the macOS-level protections (library
  # validation, restricted DYLIB injection, code integrity) required for
  # notarization. Entitlements are in build/entitlements.mac.plist; only
  # the minimum set needed by Electron + node-pty is enabled there.
  #
  # With `identity: null` the build is produced unsigned, so hardened
  # runtime has no runtime effect until a signing identity is provided
  # via CSC_LINK / CSC_KEY_PASSWORD — at which point signing, hardened
  # runtime, and notarization all compose correctly.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # Code signing disabled for now — set CSC_LINK and CSC_KEY_PASSWORD
  # environment variables when you have an Apple Developer certificate
  identity: null

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# ── Windows ──────────────────────────────────────────────────────────────────
win:
  icon: build/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # Code signing disabled for now — set CSC_LINK and CSC_KEY_PASSWORD
  # environment variables when you have a Windows code signing certificate

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"

# ── Linux ────────────────────────────────────────────────────────────────────
linux:
  icon: build/icons
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  synopsis: Multi-repo multi-agent IDE
  description: >
    A desktop-first developer tool that manages the full software development
    lifecycle across multiple repositories simultaneously with AI agent dispatch.

appImage:
  artifactName: "${productName}-${version}-${arch}.${ext}"

deb:
  depends:
    - gconf2
    - gconf-service
    - libnotify4
    - libappindicator1
    - libxtst6
    - libnss3
  artifactName: "${productName}-${version}-${arch}.${ext}"

# ── Artifact naming ──────────────────────────────────────────────────────────
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
