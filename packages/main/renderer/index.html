<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magenta IDE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #fff;
    }
    p {
      font-size: 1.1rem;
      color: #b0b0b0;
      margin: 0.5rem 0;
    }
    .status {
      margin-top: 2rem;
      padding: 1rem;
      background: #2d2d2d;
      border-radius: 8px;
      border-left: 4px solid #007acc;
    }
    .loading {
      display: inline-block;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <div class="container">
      <h1>🧠 Magenta IDE</h1>
      <p>JavaScript is required to run Magenta IDE</p>
    </div>
  </noscript>
  <script src="../../ui/dist/bundle.js"></script>
</body>
</html>
